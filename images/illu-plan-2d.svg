<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-label="Plan 2D coté d'un logement">
  <!-- Illustration d'exemple — plan 2D avec cotes. Remplacer ce bloc SVG par un plan réel. -->
  <rect width="480" height="380" fill="#ffffff"/>
  <!-- light grid -->
  <g stroke="#0f1a2b" stroke-opacity=".08" stroke-width="0.6">
    <path d="M40 20 V360 M60 20 V360 M80 20 V360 M100 20 V360 M120 20 V360 M140 20 V360 M160 20 V360 M180 20 V360 M200 20 V360 M220 20 V360 M240 20 V360 M260 20 V360 M280 20 V360 M300 20 V360 M320 20 V360 M340 20 V360 M360 20 V360 M380 20 V360 M400 20 V360 M420 20 V360 M440 20 V360"/>
    <path d="M20 40 H460 M20 60 H460 M20 80 H460 M20 100 H460 M20 120 H460 M20 140 H460 M20 160 H460 M20 180 H460 M20 200 H460 M20 220 H460 M20 240 H460 M20 260 H460 M20 280 H460 M20 300 H460 M20 320 H460 M20 340 H460"/>
  </g>
  <!-- walls (outer) 80,70 to 400,310 -->
  <g fill="none" stroke="#0f1a2b" stroke-width="7" stroke-linejoin="miter">
    <path d="M80 70 H400 V310 H80 Z"/>
  </g>
  <!-- inner walls -->
  <g fill="none" stroke="#0f1a2b" stroke-width="5">
    <!-- vertical partition -->
    <path d="M250 70 V210"/>
    <!-- bathroom box -->
    <path d="M250 210 H400"/>
    <path d="M330 210 V310"/>
  </g>
  <!-- door openings (white cuts) -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="butt">
    <!-- entry bottom -->
    <path d="M120 310 H155"/>
    <!-- living to bedroom -->
    <path d="M250 110 V150"/>
    <!-- living to bath -->
    <path d="M280 210 H315"/>
    <!-- bath to wc? skip -->
    <path d="M330 250 V285"/>
  </g>
  <!-- door swings -->
  <g fill="none" stroke="#0f1a2b" stroke-width="1">
    <path d="M120 310 A35 35 0 0 1 155 310"/>
    <path d="M250 110 A40 40 0 0 0 250 150"/>
    <path d="M280 210 A35 35 0 0 0 315 210"/>
    <path d="M330 250 A35 35 0 0 1 330 285"/>
  </g>
  <!-- windows (double tick on outer walls) -->
  <g stroke="#0f1a2b">
    <path d="M190 70 H250" stroke-width="3"/>
    <path d="M190 64 H250" stroke-width="1.2"/>
    <path d="M190 76 H250" stroke-width="1.2"/>
    <path d="M400 100 V160" stroke-width="3"/>
    <path d="M394 100 V160" stroke-width="1.2"/>
    <path d="M406 100 V160" stroke-width="1.2"/>
    <path d="M80 180 V240" stroke-width="3"/>
    <path d="M74 180 V240" stroke-width="1.2"/>
    <path d="M86 180 V240" stroke-width="1.2"/>
  </g>
  <!-- furniture blocks -->
  <g fill="none" stroke="#1e3a5f" stroke-width="1.1">
    <!-- sofa -->
    <rect x="100" y="100" width="90" height="34"/>
    <rect x="104" y="104" width="82" height="18"/>
    <!-- table -->
    <circle cx="165" cy="175" r="22"/>
    <!-- bed -->
    <rect x="270" y="90" width="110" height="70"/>
    <rect x="274" y="94" width="102" height="24"/>
    <!-- kitchen counter -->
    <path d="M90 250 H200 V300"/>
    <rect x="90" y="250" width="110" height="18"/>
    <!-- bath -->
    <rect x="345" y="225" width="44" height="70" rx="10"/>
    <circle cx="290" cy="270" r="14"/>
  </g>
  <!-- dimension strings -->
  <g fill="#0f1a2b" stroke="#0f1a2b" stroke-width="0.8" font-family="Inter,system-ui,sans-serif" font-size="10">
    <!-- overall width top -->
    <path d="M80 50 V44 H400 V50" fill="none"/>
    <path d="M80 40 V48 M400 40 V48" fill="none"/>
    <text x="240" y="42" text-anchor="middle">8 400</text>
    <!-- overall height right -->
    <path d="M420 70 H426 V310 H420" fill="none"/>
    <path d="M416 70 H430 M416 310 H430" fill="none"/>
    <text x="438" y="196" text-anchor="middle" transform="rotate(90 438 196)">6 200</text>
    <!-- living width -->
    <path d="M80 330 V336 H250 V330" fill="none"/>
    <text x="165" y="350" text-anchor="middle">4 200</text>
    <!-- room width -->
    <path d="M250 330 V336 H400 V330" fill="none"/>
    <text x="325" y="350" text-anchor="middle">4 200</text>
  </g>
  <g fill="#0f1a2b" font-family="Inter,system-ui,sans-serif" font-size="8" letter-spacing="1.1">
    <text x="145" y="230" text-anchor="middle">SÉJOUR</text>
    <text x="325" y="195" text-anchor="middle">CHAMBRE</text>
    <text x="290" y="302" text-anchor="middle">SDE</text>
    <text x="365" y="302" text-anchor="middle">WC</text>
    <text x="24" y="28">PLAN 2D</text>
    <text x="24" y="42" fill="#1e3a5f">NIVEAU 0 · COTES EN MM</text>
  </g>
</svg>
