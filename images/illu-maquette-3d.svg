<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-label="Maquette 3D isométrique d'un volume habité">
  <!-- Illustration d'exemple — maquette 3D isométrique. Remplacer ce bloc SVG par une image ou un rendu réel. -->
  <rect width="480" height="380" fill="#ffffff"/>
  <g fill="none" stroke="#0f1a2b" stroke-width="1.4" stroke-linejoin="miter" stroke-linecap="square">
    <!-- ground plate -->
    <polygon points="240,318 86,248 240,178 394,248" fill="#ffffff"/>
    <line x1="86" y1="248" x2="86" y2="262" />
    <line x1="394" y1="248" x2="394" y2="262" />
    <polygon points="86,262 240,332 394,262 394,248 240,318 86,248" fill="#0f1a2b" fill-opacity=".06" stroke="#0f1a2b"/>
    <!-- main volume: living -->
    <!-- left wall -->
    <polygon points="140,250 140,150 240,104 240,204" fill="#1e3a5f"/>
    <!-- right wall -->
    <polygon points="240,204 240,104 340,150 340,250" fill="#0f1a2b"/>
    <!-- roof / top slab -->
    <polygon points="140,150 240,104 340,150 240,196" fill="#ffffff"/>
    <!-- floor inside -->
    <polygon points="140,250 240,204 340,250 240,296" fill="#ffffff"/>
    <!-- ridge lines already in polygons -->
    <!-- extension / terrace -->
    <polygon points="240,204 340,250 380,230 280,184" fill="#ffffff"/>
    <polygon points="340,250 340,230 380,210 380,230" fill="#1e3a5f"/>
    <polygon points="280,184 340,230 380,210 320,164" fill="#ffffff"/>
    <!-- opening (window) on left wall -->
    <polygon points="168,232 168,172 216,150 216,210" fill="#ffffff"/>
    <line x1="192" y1="161" x2="192" y2="221"/>
    <line x1="168" y1="202" x2="216" y2="180"/>
    <!-- door on right -->
    <polygon points="268,236 268,188 300,204 300,252" fill="#ffffff"/>
    <!-- interior partition hint -->
    <polyline points="240,204 240,160"/>
    <!-- scale figure (simple) -->
    <circle cx="300" cy="268" r="5" fill="#0f1a2b" stroke="none"/>
    <line x1="300" y1="273" x2="300" y2="292"/>
    <line x1="300" y1="278" x2="292" y2="286"/>
    <line x1="300" y1="278" x2="308" y2="286"/>
    <line x1="300" y1="292" x2="294" y2="306"/>
    <line x1="300" y1="292" x2="306" y2="306"/>
  </g>
  <g fill="#0f1a2b" font-family="Inter,system-ui,sans-serif" font-size="9" letter-spacing="1.2">
    <text x="24" y="28">MAQUETTE 3D</text>
    <text x="24" y="42" fill="#1e3a5f">AXONOMÉTRIE · 1:100</text>
  </g>
</svg>
