<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-label="Feuille de plans style Revit, plan et coupe avec cartouche">
  <!-- Illustration d'exemple — feuille plan/coupe type Revit (cartouche, grille). Remplacer ce bloc SVG par une feuille réelle. -->
  <rect width="480" height="380" fill="#ffffff"/>
  <!-- sheet outer frame -->
  <rect x="16" y="16" width="448" height="348" fill="none" stroke="#0f1a2b" stroke-width="2"/>
  <rect x="22" y="22" width="436" height="336" fill="none" stroke="#0f1a2b" stroke-width="0.7"/>
  <!-- title block bottom right -->
  <g fill="none" stroke="#0f1a2b" stroke-width="1">
    <rect x="300" y="268" width="152" height="84"/>
    <path d="M300 292 H452"/>
    <path d="M300 316 H452"/>
    <path d="M300 336 H452"/>
    <path d="M376 316 V352"/>
    <path d="M338 336 V352"/>
    <path d="M414 336 V352"/>
  </g>
  <g fill="#0f1a2b" font-family="Inter,system-ui,sans-serif">
    <text x="308" y="284" font-size="8" letter-spacing="1.4">GOLLÉ NIASSE</text>
    <text x="308" y="310" font-size="7">PROJET · MAISON INDIVIDUELLE</text>
    <text x="308" y="328" font-size="7">FEUILLE A-101 · PLAN RDC / COUPE AA</text>
    <text x="308" y="348" font-size="7">ÉCH. 1:100</text>
    <text x="346" y="348" font-size="7">DATE</text>
    <text x="384" y="348" font-size="7">IND. A</text>
    <text x="422" y="348" font-size="7">A-101</text>
  </g>
  <!-- grid bubbles top -->
  <g font-family="Inter,system-ui,sans-serif" font-size="8" text-anchor="middle" fill="#0f1a2b" stroke="#0f1a2b" stroke-width="0.9">
    <circle cx="80" cy="40" r="9" fill="#ffffff"/>
    <text x="80" y="43" stroke="none">A</text>
    <circle cx="150" cy="40" r="9" fill="#ffffff"/>
    <text x="150" y="43" stroke="none">B</text>
    <circle cx="220" cy="40" r="9" fill="#ffffff"/>
    <text x="220" y="43" stroke="none">C</text>
    <circle cx="290" cy="40" r="9" fill="#ffffff"/>
    <text x="290" y="43" stroke="none">D</text>
    <line x1="80" y1="49" x2="80" y2="58" stroke-width="0.7"/>
    <line x1="150" y1="49" x2="150" y2="58" stroke-width="0.7"/>
    <line x1="220" y1="49" x2="220" y2="58" stroke-width="0.7"/>
    <line x1="290" y1="49" x2="290" y2="58" stroke-width="0.7"/>
  </g>
  <!-- grid bubbles left of plan -->
  <g font-family="Inter,system-ui,sans-serif" font-size="8" text-anchor="middle" fill="#0f1a2b" stroke="#0f1a2b" stroke-width="0.9">
    <circle cx="40" cy="80" r="9" fill="#ffffff"/>
    <text x="40" y="83" stroke="none">1</text>
    <circle cx="40" cy="140" r="9" fill="#ffffff"/>
    <text x="40" y="143" stroke="none">2</text>
    <circle cx="40" cy="200" r="9" fill="#ffffff"/>
    <text x="40" y="203" stroke="none">3</text>
    <line x1="49" y1="80" x2="58" y2="80" stroke-width="0.7"/>
    <line x1="49" y1="140" x2="58" y2="140" stroke-width="0.7"/>
    <line x1="49" y1="200" x2="58" y2="200" stroke-width="0.7"/>
  </g>
  <!-- grid lines dashed -->
  <g stroke="#1e3a5f" stroke-width="0.5" stroke-dasharray="2 3" fill="none">
    <path d="M80 58 V250 M150 58 V250 M220 58 V250 M290 58 V250"/>
    <path d="M58 80 H300 M58 140 H300 M58 200 H300"/>
  </g>
  <!-- PLAN view (walls) -->
  <g fill="none" stroke="#0f1a2b" stroke-width="3.2">
    <path d="M80 80 H290 V200 H80 Z"/>
  </g>
  <g fill="none" stroke="#0f1a2b" stroke-width="2">
    <path d="M150 80 V150 H290"/>
    <path d="M80 140 H130"/>
  </g>
  <!-- door gaps -->
  <g stroke="#ffffff" stroke-width="3.2">
    <path d="M100 200 H124"/>
    <path d="M150 100 V124"/>
  </g>
  <g fill="none" stroke="#0f1a2b" stroke-width="0.8">
    <path d="M100 200 A24 24 0 0 1 124 200"/>
  </g>
  <!-- section cut line AA -->
  <g stroke="#0f1a2b" stroke-width="1.1" fill="#0f1a2b">
    <path d="M70 170 H300" stroke-dasharray="6 3"/>
    <polygon points="70,170 80,166 80,174"/>
    <polygon points="300,170 290,166 290,174"/>
    <text x="64" y="166" font-family="Inter,system-ui,sans-serif" font-size="8" stroke="none">A</text>
    <text x="304" y="166" font-family="Inter,system-ui,sans-serif" font-size="8" stroke="none">A</text>
  </g>
  <text x="180" y="246" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#0f1a2b" letter-spacing="1.2">PLAN RDC</text>
  <!-- SECTION AA on the right -->
  <g transform="translate(318,50)">
    <text x="60" y="-8" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#0f1a2b" letter-spacing="1.2" text-anchor="middle">COUPE AA</text>
    <!-- ground line -->
    <path d="M8 180 H120" stroke="#0f1a2b" stroke-width="1.2" fill="none"/>
    <path d="M8 180 L8 186 L120 186 L120 180" stroke="#0f1a2b" stroke-width="0.6" fill="#0f1a2b" fill-opacity=".08"/>
    <!-- hatch ground -->
    <g stroke="#0f1a2b" stroke-width="0.5" fill="none">
      <path d="M14 186 L20 196 M28 186 L34 196 M42 186 L48 196 M56 186 L62 196 M70 186 L76 196 M84 186 L90 196 M98 186 L104 196 M112 186 L118 196"/>
    </g>
    <!-- wall sections (poché) -->
    <rect x="20" y="70" width="8" height="110" fill="#0f1a2b"/>
    <rect x="100" y="70" width="8" height="110" fill="#0f1a2b"/>
    <!-- floor slab -->
    <rect x="20" y="170" width="88" height="6" fill="#0f1a2b"/>
    <!-- roof / ceiling slab -->
    <rect x="20" y="70" width="88" height="6" fill="#0f1a2b"/>
    <!-- mid floor -->
    <rect x="20" y="120" width="88" height="4" fill="#1e3a5f"/>
    <!-- window openings (white) -->
    <rect x="20" y="90" width="8" height="22" fill="#ffffff" stroke="#0f1a2b" stroke-width="0.6"/>
    <rect x="100" y="90" width="8" height="22" fill="#ffffff" stroke="#0f1a2b" stroke-width="0.6"/>
    <!-- levels -->
    <g stroke="#0f1a2b" stroke-width="0.7" fill="#0f1a2b" font-family="Inter,system-ui,sans-serif" font-size="6">
      <path d="M112 176 H130"/>
      <text x="132" y="178" stroke="none">NIV. 0.00</text>
      <path d="M112 122 H130"/>
      <text x="132" y="124" stroke="none">NIV. +2.70</text>
      <path d="M112 73 H130"/>
      <text x="132" y="75" stroke="none">NIV. +5.40</text>
    </g>
  </g>
</svg>
